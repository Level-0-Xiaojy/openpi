[project]
name = "pyav"
version = "12.0.5"
description = "Local compatibility shim: LeRobot depends on `pyav`, but PyPI distributes PyAV as `av`."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PyAV is published on PyPI as `av` (import name `av`).
    "av>=12.0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["pyav"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
