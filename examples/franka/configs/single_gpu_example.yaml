# Single GPU training example
# Copy this for single GPU training

# Basic info
task_name: "pi05_sim_sm_10hz_pp_single"
instruction: "pick the dice and place it into the green plate"

# Model config
model:
  config_name: "pi05_franka"
  pytorch_weight_path: "checkpoints/torch/pi05_base"

# Data config
data:
  repo_id: "pi05_sim_sm_10hz_pp"
  data_dir: "share_datasets/sim_sm_10hz_pp"

# Training config
train:
  num_train_steps: 30000
  save_interval: 5000
  batch_size: 32
  overwrite: true
  multi_gpu: false
  num_gpus: 1
  exp_name: "single_gpu_training"

# Deployment config  
deploy:
  host: "0.0.0.0"
  port: 12559

# GPU config
gpu:
  device_id: 0
  xla_preallocate: false