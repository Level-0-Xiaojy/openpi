# Task configuration for training and deployment
# Use this file with:
#   Train:  uv run examples/franka/run_task.py train --config configs/pi05_sim_sm_10hz_pp.yaml
#   Deploy: uv run examples/franka/run_task.py deploy --config configs/pi05_sim_sm_10hz_pp.yaml

# Basic info
task_name: "pi05_sim_sm_10hz_pp"
instruction: "pick the dice and place it into the green plate"

# Model config
model:
  config_name: "pi05_franka"                    # Training config name in openpi
  pytorch_weight_path: "checkpoints/torch/pi05_base"  # Base model weights
  discrete_state_input: false                   # Not use state for train

# Data config
data:
  repo_id: "pi05_sim_sm_10hz_pp"                # LeRobot dataset repo ID
  data_dir: "share_datasets/sim_sm_10hz_pp"     # Raw data directory (for conversion)

# Training config
train:
  num_train_steps: 30000
  save_interval: 5000
  batch_size: 32                                # Total batch size across all GPUs
  overwrite: true
  # Multi-GPU training settings
  multi_gpu: true
  num_gpus: 4                                   # Number of GPUs to use
  # exp_name will default to task_name if not specified
  exp_name: "pi05_sim_sm_10hz_pp_multi_gpu_training"

# Deployment config  
deploy:
  host: "0.0.0.0"
  port: 12559
  # checkpoint_dir will default to "checkpoints/{config_name}/{task_name}/{latest_step}"
  checkpoint_dir: "checkpoints/pi05_franka/pi05_sim_sm_10hz_pp/30000"

# GPU config
gpu:
  device_ids: [2, 3, 4, 5]                            # List of GPU device IDs to use
  xla_preallocate: false
