# Task configuration for training and deployment
# Use this file with:
#   Train:  uv run examples/franka/run_task.py train --config configs/pi05_sim_sm_10hz_pp.yaml
#   Deploy: uv run examples/franka/run_task.py deploy --config configs/pi05_sim_sm_10hz_pp.yaml

# Basic info
task_name: "pi05_sim_sm_10hz_pp_zscore_state"
instruction: "pick the dice and place it into the green plate"

# Model config
model:
  config_name: "pi05_franka"                    # Uses config that supports norm_mode
  pytorch_weight_path: "checkpoints/torch/pi05_base"  # Base model weights
  discrete_state_input: true                   # Not use state for train

# Data config
data:
  repo_id: "pi05_sim_sm_10hz_pp"               # LeRobot dataset repo ID
  data_dir: "share_datasets/sim_sm_10hz_pp"    # Raw data directory (for conversion)

# Normalization mode: "auto" (use model type default), "quantile_norm", "z_score"  
norm_mode: "z_score"  # Force z-score normalization to avoid quantile issues

# Norm stats config
norm_stats:
  # GPU settings for norm stats computation
  gpu_id: 0                                     # Single GPU for norm stats
  xla_preallocate: false
  overwrite: false                              # Set to true to recompute norm stats even if they exist

# Training config
train:
  num_train_steps: 30000
  save_interval: 5000
  batch_size: 32                                # Total batch size across all GPUs
  overwrite: true
  # GPU settings for training
  gpu_ids: [0, 1, 2, 3]                               # Multi-GPU training
  xla_preallocate: false

# Inference/Validation config (for validating on dataset)
infer:
  checkpoint_step: "25000"                     # Checkpoint to use for inference ("latest" or specific step)
  steps: 150                                    # Number of steps to run in trajectory
  plot: true                                    # Generate plots
  traj_id: 0                                    # Trajectory ID to validate
  gpu_id: 6                                     # Single GPU for inference

# Deployment config  
deploy:
  host: "0.0.0.0"
  port: 12321
  checkpoint_step: "25000"                     # Use latest checkpoint
  # GPU settings for deployment
  gpu_id: 6                                     # Single GPU for deployment
  xla_preallocate: false

# Remote sync config (for downloading checkpoints and assets from remote server)
remote:
  enabled: true
  host: "wq-dev0"
  remote_path: "/mnt/public/bingwen/Projects/openpi"
  local_path: "~/Documents/openpi"
  checkpoint_step: "25000"                     # Sync latest checkpoint
