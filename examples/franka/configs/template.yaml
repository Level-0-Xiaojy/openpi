# Task configuration template
# Copy this file and modify for your own task

# Basic info
task_name: "your_task_name"           # Used as exp_name and for finding checkpoints
instruction: "your task instruction"  # Language instruction for the robot

# Model config
model:
  config_name: "pi05_franka"                    # Options: pi05_franka, pi05_franka_single_cam, pi0_fast_franka
  pytorch_weight_path: "checkpoints/torch/pi05_base"
  # discrete_state_input: true                 # Optional: true for discrete tokens, false for continuous vector
                                                # Default: true for pi05, false for others

# Data config
data:
  repo_id: "your_lerobot_dataset_id"            # LeRobot dataset repo ID (in ~/.cache/huggingface/lerobot/)
  data_dir: "path/to/raw/data"                  # Raw data directory (only needed for data conversion)

# Training config
train:
  num_train_steps: 30000
  save_interval: 5000
  batch_size: 32                                # Total batch size across all GPUs
  overwrite: true                               # Overwrite existing checkpoints
  overwrite_norm_stats: false                   # Set to true to recompute norm stats if they exist
  # Multi-GPU training options
  multi_gpu: false                              # Set to true for multi-GPU training  
  num_gpus: 1                                   # Number of GPUs to use
  # exp_name: "custom_name"                     # Optional: defaults to task_name

# Deployment config  
deploy:
  host: "0.0.0.0"
  port: 12559
  # checkpoint_dir: "path/to/checkpoint"        # Optional: auto-finds latest if not specified

# GPU config
gpu:
  # Single GPU (default)
  device_id: 0                                  # For single GPU training
  # Multi-GPU 
  # device_ids: [0, 1]                          # For multi-GPU training (comment out device_id)
  xla_preallocate: false
